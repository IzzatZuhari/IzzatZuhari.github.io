<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kaunter 4: Simulasi JPUAM</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1f4b">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--b:#0b1f4b;--y:#ffd23f}
body{font-family:system-ui,sans-serif;background:#120e0a;color:#fff;height:100dvh;overflow:hidden;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;background:#0b1f4b;overflow:hidden;padding-top:env(safe-area-inset-top)}
#bg{position:absolute;inset:0 0 40% 0;z-index:0}#bg svg{width:100%;height:100%}#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#0b1f4b99,#0b1f4b11 40%,#0b1f4bcc)}
#top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:700;font-size:12px;z-index:1;background:#0b1f4bcc}
#led{background:#150a00;color:#ff9a1f;font:700 18px monospace;padding:1px 8px;border:2px solid #444;border-radius:4px;text-shadow:0 0 8px #ff9a1f}
#stats{display:flex;gap:8px;z-index:1;padding:4px 10px;background:#0b1f4bcc}
.st{position:relative;flex:1;font-size:11px;text-align:center}.bar{height:9px;background:#0006;border-radius:5px;overflow:hidden;margin-top:2px;border:1px solid #fff3}
.bar i{display:block;height:100%;width:100%;transition:width .4s}#be{background:#ffb703}#bp{background:#ff4d6d}#bk{background:#2ec4b6;width:0}
.st.hint{animation:pu .5s infinite alternate}@keyframes pu{to{transform:scale(1.2)}}
.pop{position:absolute;left:50%;top:-4px;font-size:16px;animation:pp .9s forwards;pointer-events:none;text-shadow:0 1px 3px #000;z-index:9}.pop.up{color:#7cfc9a}.pop.dn{color:#ff6b6b}@keyframes pp{to{transform:translateY(-36px);opacity:0}}
#timer{height:4px;background:var(--y);z-index:1}
#booth{flex:0 0 22%;min-height:130px;display:flex;align-items:flex-end;gap:10px;padding:8px 10px 0;z-index:1}
#av{font-size:64px;line-height:1;background:#9ad1ff44;border:3px solid #fff5;border-bottom:0;border-radius:10px 10px 0 0;padding:4px 10px 0;filter:drop-shadow(0 4px 4px #0006)}
#say{flex:1;background:#fff;color:#111;border-radius:12px;padding:8px 10px;font-size:13px;font-style:italic;align-self:center;position:relative;max-height:96px;overflow:hidden}
#say:before{content:"";position:absolute;left:-8px;top:50%;border:8px solid transparent;border-right-color:#fff;border-left:0;margin-top:-8px}
#desk{flex:1;z-index:1;display:flex;gap:10px;padding:12px 10px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#5a3d28 0 7px,#4f3622 7px 14px);border-top:6px solid #2b1c10;box-shadow:inset 0 10px 14px #0007}
#rules{flex:0 0 37%;background:#e8d9a2;color:#3a2a10;padding:8px;font-size:11px;transform:rotate(-1.5deg);box-shadow:3px 4px 8px #0008;border-top:10px solid #6b5b2a;align-self:flex-start;border-radius:3px}
#rules h4{font-size:10px;letter-spacing:.5px;border-bottom:1px solid #3a2a1066;padding-bottom:3px;margin-bottom:4px}#rules ol{padding-left:15px;line-height:1.35}#rules li{margin-bottom:3px}
#paper{flex:1;background:#f5f0e1;color:#1c1c1c;font-family:'Courier New',monospace;padding:10px;transform:rotate(1deg);box-shadow:3px 4px 10px #000a;position:relative;align-self:flex-start;min-height:70%;border-radius:2px;background-image:linear-gradient(#0000 94%,#0001 94%);background-size:100% 22px}
#pt{font-weight:900;font-size:12px;border-bottom:3px double #222;padding-bottom:3px;margin-bottom:6px;color:#0b1f4b}
#pf div{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;margin-bottom:3px}#pf span{opacity:.6}#pf b{text-align:right}
.ph{float:right;width:42px;height:50px;border:2px solid #222;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 0 4px 6px;background:#dfe9f3}
.slip{font-size:12.5px;line-height:1.4}
#ink{position:absolute;left:12%;top:34%;font:900 28px monospace;border:4px solid;padding:2px 10px;opacity:0;transform:rotate(-14deg) scale(2.2);transition:all .15s;pointer-events:none;z-index:3}
#ink.on{opacity:.88;transform:rotate(-14deg) scale(1)}#ink.g{color:#1f8a4c}#ink.r{color:#c0392b}
#btns{display:flex;gap:10px;padding:8px 10px;z-index:2;background:#2b1c10}
#btns button{flex:1;min-height:56px;border:3px solid #fff5;border-radius:8px;font-weight:900;font-size:13px;color:#fff;padding:4px;letter-spacing:.5px}
#ba{background:#b32d2e;box-shadow:0 5px 0 #6e1a1b}#bb{background:#1f7a45;box-shadow:0 5px 0 #124a2a}
#btns button:active{transform:translateY(4px);box-shadow:none}
#qe{position:absolute;left:8px;right:8px;bottom:8px;top:36%;background:#fff7cc;color:#222;border:4px solid #e0a800;border-radius:8px;display:none;flex-direction:column;gap:8px;padding:0 0 10px;z-index:6;overflow:hidden;box-shadow:0 8px 24px #000a;animation:qi .2s}@keyframes qi{from{transform:scale(.85);opacity:0}}
#qh{background:repeating-linear-gradient(45deg,#222 0 10px,#e0a800 10px 20px);color:#fff;font-weight:900;text-align:center;padding:5px;text-shadow:0 1px 2px #000;font-size:13px;letter-spacing:1px}
#qb{padding:0 12px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}#qi{font-size:44px}#qt{font-weight:900;color:var(--b)}#qx{font-size:14px;margin-top:4px}
#qa,#qc{margin:0 12px;padding:10px;border:0;border-radius:8px;font-weight:800;font-size:13px;background:var(--b);color:#fff;box-shadow:0 4px 0 #000a}#qa:active,#qc:active{transform:translateY(3px);box-shadow:none}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:-60px;background:var(--y);color:var(--b);font-weight:800;padding:10px 16px;border-radius:12px;z-index:20;transition:top .4s;white-space:nowrap}
#ov{position:absolute;inset:0;background:#0b1f4bd8;overflow:auto;display:none;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:26px;gap:12px;z-index:9}
#ov h1{color:var(--y);font-size:26px}#ov p{line-height:1.5;font-size:15px}#ov .e{font-size:80px}
#ov button{background:var(--y);color:var(--b);border:0;border-radius:14px;padding:14px 26px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #b8941f}
#ov button.s{background:#fff3;color:#fff;box-shadow:none;font-size:13px;padding:10px 18px}
#ov button.m{width:100%;max-width:320px;background:#fff2;color:#fff;box-shadow:none;border:2px solid #fff4;text-align:left;padding:10px 14px;font-size:15px}#ov button.m.on{background:#ffd23f33;border-color:var(--y)}
#ov small{display:block;font-weight:400;font-size:12px;opacity:.8}.row{display:flex;gap:6px}.sub{opacity:.8}.on2{outline:2px solid var(--y)}
.al{display:grid;gap:6px;text-align:left;font-size:13px;width:100%;max-width:320px}.al div{background:#fff2;padding:8px;border-radius:10px}.al .lk{opacity:.4}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b1f4b;transition:opacity .4s}#splash.gone{opacity:0;pointer-events:none}.sm{width:96px;height:96px;border-radius:22px;background:#ffd23f;color:#0b1f4b;font:900 46px monospace;display:flex;align-items:center;justify-content:center}.sb{width:140px;height:3px;background:#fff3;overflow:hidden}.sb span{display:block;width:40%;height:100%;background:#ffd23f;animation:sr 1s infinite}@keyframes sr{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
</style></head><body><div id="app">
<div id="bg"></div><div id="toast"></div>
<div id="top"><span>🏛️ JPUAM · KAUNTER 4 · <span id="dy"></span></span><span id="led">042</span><span id="clk"></span></div>
<div id="stats"><div class="st" id="se">⚡ Tenaga<div class="bar"><i id="be"></i></div></div><div class="st" id="sp">😡 Kesabaran<div class="bar"><i id="bp"></i></div></div><div class="st" id="sk">📊 KPI <b id="kt"></b><div class="bar"><i id="bk"></i></div></div></div>
<div id="timer"></div>
<div id="booth"><div id="av"></div><div id="say"></div></div>
<div id="desk"><div id="rules"><h4>📋 PERATURAN HARI INI</h4><ol id="rl"></ol></div><div id="paper"><div id="pt"></div><div id="pf"></div><div id="ink"></div></div>
<div id="qe"><div id="qh">⚠ PERISTIWA PANTAS ⚠</div><div id="qb"><div id="qi"></div><div id="qt"></div><div id="qx"></div></div><button id="qa"></button><button id="qc"></button></div></div>
<div id="btns"><button id="ba"></button><button id="bb"></button></div>
<div id="ov"></div></div>
<div id="splash"><div class="sm">K4</div><b>Kaunter 4</b><div class="sb"><span></span></div></div>
<script src="cards.js"></script><script src="game.js"></script></body></html>
