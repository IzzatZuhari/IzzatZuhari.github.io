<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kaunter 4: Simulasi JPUAM</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1f4b">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--b:#0b1f4b;--y:#ffd23f;--p:#f7f0dc}
body{font-family:system-ui,sans-serif;background:var(--b);color:#fff;height:100dvh;overflow:hidden;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);position:relative;background:linear-gradient(#0b1f4b,#16337a 55%,#0b1f4b);overflow:hidden}
#hall{position:absolute;inset:auto 0 0;height:30%;display:flex;flex-wrap:wrap;justify-content:space-around;align-content:flex-end;font-size:34px;opacity:.28;filter:hue-rotate(190deg) saturate(4);pointer-events:none}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-weight:700;font-size:13px;z-index:1}
#led{background:#150a00;color:#ff9a1f;font:700 20px monospace;padding:2px 10px;border:2px solid #444;border-radius:6px;text-shadow:0 0 8px #ff9a1f}
#stats{display:flex;gap:8px;z-index:1}
.st{flex:1;font-size:12px;text-align:center}.bar{height:10px;background:#0006;border-radius:6px;overflow:hidden;margin-top:3px;border:1px solid #fff3}
.bar i{display:block;height:100%;width:100%;transition:width .4s,background .3s}
#be{background:#ffb703}#bp{background:#ff4d6d}#bk{background:#2ec4b6;width:0}
.st.hint{animation:pu .5s infinite alternate}@keyframes pu{to{transform:scale(1.25)}}
#timer{height:4px;background:var(--y);margin:10px 0 0;border-radius:4px;z-index:1}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
#card{width:100%;max-width:340px;background:var(--p);color:#222;border-radius:18px;padding:18px;text-align:center;box-shadow:0 14px 30px #0008;touch-action:none;cursor:grab;position:relative;border-top:10px solid var(--y)}
#ico{font-size:72px;line-height:1.1;filter:drop-shadow(0 4px 3px #0004)}#ct{font-weight:800;color:var(--b);margin:6px 0;font-size:19px}
#tx{font-size:15px;line-height:1.4;min-height:84px;font-style:italic}
.lb{position:absolute;top:50%;max-width:48%;padding:8px;border-radius:10px;font-weight:800;font-size:13px;color:#fff;opacity:0;background:var(--b);box-shadow:0 4px 10px #0006}
#la{left:-6px;transform:rotate(-8deg)}#lb{right:-6px;transform:rotate(8deg)}
#btns{display:flex;gap:10px;padding:10px 0;z-index:1}
#btns button{flex:1;min-height:56px;border:0;border-radius:14px;font-weight:700;font-size:13px;background:var(--y);color:var(--b);padding:6px;box-shadow:0 4px 0 #b8941f}
#btns button:active{transform:translateY(3px);box-shadow:none}
#ov{position:absolute;inset:0;background:#0b1f4bd8;overflow:auto;display:none;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:26px;gap:12px;z-index:9}
#ov h1{color:var(--y);font-size:26px}#ov p{line-height:1.5;font-size:15px}#ov .e{font-size:80px}
#ov button{background:var(--y);color:var(--b);border:0;border-radius:14px;padding:14px 26px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #b8941f}
#ov button.s{background:#fff3;color:#fff;box-shadow:none;font-size:13px;padding:10px 18px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#bg{position:absolute;inset:0;z-index:0}#bg svg{width:100%;height:100%}#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#0b1f4b88,#0b1f4b00 35%,#0b1f4bcc)}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:-60px;background:var(--y);color:var(--b);font-weight:800;padding:10px 16px;border-radius:12px;z-index:20;transition:top .4s;white-space:nowrap}
#ov button.m{width:100%;max-width:320px;background:#fff2;color:#fff;box-shadow:none;border:2px solid #fff4;text-align:left;padding:10px 14px;font-size:15px}#ov button.m.on{background:#ffd23f33;border-color:var(--y)}
#ov small{display:block;font-weight:400;font-size:12px;opacity:.8}.row{display:flex;gap:6px}.sub{opacity:.8}
.lbl{text-align:left;padding-left:22px;line-height:1.9}.lbl span{float:right;color:var(--y);font-weight:800;margin-left:12px}.al{display:grid;gap:6px;text-align:left;font-size:13px;width:100%;max-width:320px}.al div{background:#fff2;padding:8px;border-radius:10px}.al .lk{opacity:.4}
.on2{outline:2px solid var(--y)}</style></head><body><div id="app">
<div id="bg"></div><div id="toast"></div>
<div id="top"><span>🏛️ KAUNTER 4 · <span id="dy"></span></span><span id="led">042</span><span id="clk"></span></div>
<div id="stats"><div class="st" id="se">⚡ Tenaga<div class="bar"><i id="be"></i></div></div><div class="st" id="sp">😡 Kesabaran<div class="bar"><i id="bp"></i></div></div><div class="st" id="sk">📊 KPI <b id="kt"></b><div class="bar"><i id="bk"></i></div></div></div>
<div id="timer"></div>
<div id="stage"><div id="card"><div class="lb" id="la"></div><div class="lb" id="lb"></div><div id="ico"></div><div id="ct"></div><div id="tx"></div></div></div>
<div id="btns"><button id="ba"></button><button id="bb"></button></div>
<div id="ov"></div></div>
<script src="cards.js"></script><script src="game.js"></script></body></html>
