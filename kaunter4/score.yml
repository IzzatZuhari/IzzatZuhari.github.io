name: score
on: {issues: {types: [opened]}}
permissions: {contents: write, issues: write}
jobs:
  add:
    if: startsWith(github.event.issue.title,'SCORE|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),f='kaunter4/leaderboard.json';
            const [,n,m,d,t,s]=context.payload.issue.title.split('|');
            const e={n:(n||'').replace(/[^\w ]/g,'').slice(0,12)||'Anon',m:(m||'').slice(0,6),d:+d|0,t:+t|0,s:+s|0};
            if(e.d>0&&e.d<200&&e.t<5000&&e.s===e.t*10+e.d*50){const a=JSON.parse(fs.readFileSync(f));a.push(e);a.sort((x,y)=>y.s-x.s);fs.writeFileSync(f,JSON.stringify(a.slice(0,100)))}
            await github.rest.issues.update({...context.repo,issue_number:context.issue.number,state:'closed'});
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -m "score" || true; git push
